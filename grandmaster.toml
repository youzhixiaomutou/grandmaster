# Grandmaster 配置：启用的工具、软链接策略、各能力激活的实现。
# 优先级：本文件 < 用户配置 < 环境变量（如 GM_CAP_memory=mysql 临时覆盖）。

active_profile = "local-dev"

[tools]
enabled = ["claude", "codex"]

[link]
granularity = "dir"    # dir = 整目录软链接（加技能免同步）| per-skill
mode = "symlink"       # symlink | copy（不支持软链接的环境）

[capabilities]
# 能力 → 激活的 provider（可为单个字符串或多个数组；多 provider 语义见 contracts/CONVENTIONS.md）。
memory = "local"
issue = ["local", "github"]   # 需求澄清结论同时固化到 本地文档 + GitHub issue（写类 fan-out）
design = ["local", "github"]  # 设计：local=docs/designs、github=评论到原 issue
task = ["local", "github"]    # 执行/测试报告：local=docs/plans、github=评论到 PR
doc = ["local", "github"]     # 文档条目：local=docs/notes、github=评论到 PR
# 以上 4 者另有 gitlab 实现（glab；MR↔PR、issue-note↔评论），可加入数组启用，例：issue = ["local","github","gitlab"]
# notification = "webhook"
secret-source = "env"          # 按名取密钥（值只运行期读取，不入库）

# provider 默认配置见各 module.toml 的 [config]（单一来源）。
# 仅当需要覆盖某 provider 默认时才在此声明，例：
# [providers.issue.local]
# dir = "docs/requirements"
